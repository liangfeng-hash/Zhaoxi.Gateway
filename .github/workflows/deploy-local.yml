name: 部署到本机

on:
  push:
    branches: [ main ]
    # 只有这些路径变了才触发。网关是扁平结构，文件少，正列一目了然
    paths:
      - 'Program.cs'
      - '*.csproj'
      - 'appsettings*'          # appsettings.json 等配置文件
      - '.github/workflows/**'
  workflow_dispatch:      # 保留手动触发，排障时有用

concurrency:
  group: deploy-local-gateway
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  # ⚠️ 关掉 git 的 fsmonitor 守护进程，否则 checkout 收尾时报 EBUSY（详见附录 A）
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: 'core.fsmonitor'
  GIT_CONFIG_VALUE_0: 'false'
  GW_SITE:     'C:\inetpub\zhaoxi-gateway'
  GW_POOL:     'zhaoxi-gateway'
  GW_SITENAME: 'zhaoxi-gateway'    # IIS 站点名（与应用池同名，但两者是不同对象）
  GW_URL:      'http://localhost/health'      # 网关自身的 health，不是 /api/health（见下面 ③）
  BACKUP_ROOT: 'C:\deploy-backup'

jobs:
  deploy:
    runs-on: [self-hosted, windows, local]
    environment: local          # 决定读哪一套 Environment Secrets/Variables

    steps:
      - uses: actions/checkout@v4

      - name: 构建
        shell: pwsh
        run: dotnet publish Zhaoxi.Gateway.csproj -c Release -o "$env:RUNNER_TEMP\publish\gateway"

      # ---------- 渲染生产配置 ----------
      # 位置：构建之后、备份之前。渲染失败就中止，此时站点还没被碰过。
      - name: 渲染生产配置
        shell: pwsh
        env:
          GW_API_DESTINATIONS:  ${{ vars.GW_API_DESTINATIONS }}
          GW_AUTH_DESTINATIONS: ${{ vars.GW_AUTH_DESTINATIONS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($n in 'GW_API_DESTINATIONS','GW_AUTH_DESTINATIONS') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))) {
              Write-Error "缺少 variable: $n（去仓库 Settings - Environments 里配）"; exit 1
            }
          }

          # variable 里存的是 JSON 片段，转成对象后嵌进去，不用拼字符串
          $cfg = @{
            ReverseProxy = @{
              Clusters = @{
                'api-cluster'  = @{ Destinations = ($env:GW_API_DESTINATIONS  | ConvertFrom-Json) }
                'auth-cluster' = @{ Destinations = ($env:GW_AUTH_DESTINATIONS | ConvertFrom-Json) }
              }
            }
          }
          $out = "$env:RUNNER_TEMP\publish\gateway\appsettings.Production.json"
          [System.IO.File]::WriteAllText($out, ($cfg | ConvertTo-Json -Depth 10),
                                         (New-Object System.Text.UTF8Encoding $false))
          Write-Host "  渲染 -> $out"

          # 校验：至少有一个后端节点，否则网关起来了也转发不出去
          $chk = Get-Content $out -Raw -Encoding UTF8 | ConvertFrom-Json
          $n1 = ($chk.ReverseProxy.Clusters.'api-cluster'.Destinations  | Get-Member -MemberType NoteProperty).Count
          $n2 = ($chk.ReverseProxy.Clusters.'auth-cluster'.Destinations | Get-Member -MemberType NoteProperty).Count
          if ($n1 -lt 1 -or $n2 -lt 1) { Write-Error "集群节点为空：api=$n1 auth=$n2"; exit 1 }
          Write-Host "  节点数校验通过（api=$n1, auth=$n2）"

      - name: 备份
        shell: pwsh
        run: |
          $dest = Join-Path $env:BACKUP_ROOT "gateway\$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          robocopy $env:GW_SITE $dest /E /XD logs wwwroot /NFL /NDL /NJH /NJS /R:2 /W:1 | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Error "备份失败"; exit 1 }
          Get-ChildItem (Join-Path $env:BACKUP_ROOT 'gateway') -Directory |
            Sort-Object Name -Descending | Select-Object -Skip 5 | Remove-Item -Recurse -Force
          exit 0

      - name: 放置 app_offline.htm
        shell: pwsh
        run: |
          '<html><body><h2>正在部署…</h2></body></html>' |
            Set-Content (Join-Path $env:GW_SITE 'app_offline.htm') -Encoding UTF8
          Start-Sleep -Seconds 5

      - name: 同步
        shell: pwsh
        run: |
          robocopy "$env:RUNNER_TEMP\publish\gateway" $env:GW_SITE /MIR `
            /XF appsettings.Development.json app_offline.htm `
            /XD logs wwwroot `
            /NFL /NDL /NJH /NJS /R:3 /W:2
          if ($LASTEXITCODE -ge 8) { Write-Error "同步失败 code=$LASTEXITCODE"; exit 1 }
          exit 0

      - name: 移除 app_offline.htm
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:GW_SITE 'app_offline.htm') -Force -ErrorAction SilentlyContinue

      - name: 启动应用池与站点
        shell: pwsh
        # ⚠️ 三个层级各自独立：app_offline.htm（应用层，上一步已删）、
        # 应用池（进程层，停着是 503）、站点（端口监听层，停着直接连不上）。
        # 只回收应用池不够 —— 站点被停过或新机器首次部署时，它不会自己起来。
        run: |
          $appcmd = "$env:SystemRoot\System32\inetsrv\appcmd.exe"

          $state = (& $appcmd list apppool "$env:GW_POOL" /text:state) 2>$null
          if ($state -ne 'Started') {
            & $appcmd start apppool "$env:GW_POOL" | Out-Null
            Write-Host "  应用池 $env:GW_POOL 已启动（原状态: $state）"
          } else {
            & $appcmd recycle apppool "$env:GW_POOL" | Out-Null
            Write-Host "  应用池 $env:GW_POOL 已回收"
          }

          $state = (& $appcmd list site "$env:GW_SITENAME" /text:state) 2>$null
          if ([string]::IsNullOrWhiteSpace($state)) {
            Write-Error "站点 $env:GW_SITENAME 不存在 —— 需要先按手册 1.4 建站"; exit 1
          }
          if ($state -ne 'Started') {
            & $appcmd start site "$env:GW_SITENAME" | Out-Null
            Write-Host "  站点 $env:GW_SITENAME 已启动（原状态: $state）"
          } else {
            Write-Host "  站点 $env:GW_SITENAME 运行中"
          }

      - name: 健康检查（网关自身 + 前端首页）
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              if ((Invoke-WebRequest $env:GW_URL -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) {
                $ok = $true; break
              }
            } catch { }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { Write-Error "网关健康检查失败"; exit 1 }
          Write-Host "网关 /health 正常"

          # 顺带确认前端首页出得来（wwwroot 里有没有产物）
          # 注意：变量别取名 $home —— 那是 PowerShell 的只读自动变量
          $indexPage = Invoke-WebRequest "http://localhost/" -UseBasicParsing -TimeoutSec 10
          if ($indexPage.Content -notmatch '<div id="app">') { Write-Error "前端首页异常，检查 wwwroot"; exit 1 }
          Write-Host "前端首页正常"

      # ---------- 冒烟测试 ----------
      # 全程走 80 端口，比后端那条多验一层：YARP 的 /auth 和 /api 两条路由都要转发正确
      - name: 冒烟测试（经网关：登录 → 带 token 查业务数据）
        shell: pwsh
        env:
          SMOKE_USER: ${{ vars.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SMOKE_USER) -or [string]::IsNullOrWhiteSpace($env:SMOKE_PASS)) {
            Write-Error "缺少 SMOKE_USER / SMOKE_PASS，去仓库 Settings 配一下（见手册 4.5）"; exit 1
          }
          $gw = 'http://localhost'

          # ① 登录 —— 经网关 /auth 路由转发到 IdentityApi
          $body  = @{ Name = $env:SMOKE_USER; Password = $env:SMOKE_PASS } | ConvertTo-Json
          $login = Invoke-RestMethod "$gw/auth/Account" -Method Post -Body $body `
                     -ContentType 'application/json' -TimeoutSec 20
          if (-not $login.success) { Write-Error "① 经网关登录失败: $($login.message)"; exit 1 }

          $token = $login.oValue.accesstoken
          if ([string]::IsNullOrWhiteSpace($token)) { Write-Error "① 登录成功却没拿到 token"; exit 1 }
          Write-Host "① /auth 路由转发正常（用户 $($login.data.userName)）"

          # ② 带 token 查业务数据 —— 经网关 /api 路由转发到 MentApi
          $menus = Invoke-RestMethod "$gw/api/Menu/1/10" `
                     -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 20
          if (-not $menus.success) { Write-Error "② 经网关业务查询失败: $($menus.message)"; exit 1 }
          Write-Host "② /api 路由转发正常（$($menus.message)）"

          # ③ 反向验证：不带 token 必须被拒（同时确认网关没把 Authorization 头吃掉）。
          #    ⚠️ 本项目是「HTTP 200 + body 业务码」风格：鉴权失败也返回 HTTP 200，
          #    真实结果在 success / oValue 里。所以必须判 body，不能靠 catch HTTP 异常。
          $anon = Invoke-RestMethod "$gw/api/Menu/1/10" -TimeoutSec 15
          if ($anon.success) { Write-Error "③ 无 token 竟能拿到数据 —— 鉴权失效"; exit 1 }
          Write-Host "③ 无 token 被正确拒绝（业务码 $($anon.oValue)）"

          Write-Host "`n冒烟测试全部通过：网关转发 / 登录链路 / 鉴权拦截"